# Snip, chapter 18: production-ready. nginx terminates TLS in front of two API containers;
# hardened (chapter 16), with limits and rotated logs (chapter 17).
#   cp .env.example .env                once: the variables compose.yaml needs
#   ./create-secrets.sh                 once: generates secrets/db_password.txt
#   ./create-dev-cert.sh                once, development only: a self-signed certificate
#   docker compose up --watch           development: everything, with source changes synced (see compose.override.yaml)
#   docker compose -f compose.yaml -f compose.prod.yaml up -d    production (see chapter 18)
#   ./deploy.sh <image>                 zero-downtime update of the API to another image
#   ./backup.sh                         a PostgreSQL backup in ./backups
#   docker compose run --rm psql        a psql shell (the "tools" profile)
name: snip

# Every service logs to rotated files: at most 3 × 10 MB each, then the oldest is deleted.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

# Settings shared by the three services that run the Snip image.
x-snip: &snip
  build: .
  # The image to run. Production sets SNIP_IMAGE in .env to a version in the registry
  # (registry.example.com/snip:1.10); a rollback is changing it back.
  image: ${SNIP_IMAGE:-snip:1.10}
  restart: unless-stopped
  logging: *logging
  environment: &snip-env
    DATABASE_URL: postgres://snip@db:5432/snip
    DATABASE_PASSWORD_FILE: /run/secrets/db_password
    VALKEY_URL: redis://valkey:6379
    # Below 512 MB of memory limit, Node.js picks a heap limit larger than the container's:
    # a leak would be OOM-killed instead of failing with a clear error. 60% leaves room for
    # buffers, native memory and the code itself.
    NODE_OPTIONS: --max-old-space-size-percentage=60
  secrets:
    - db_password
  # Hardening (chapter 16). Snip needs no Linux capabilities at all, never writes outside
  # its volumes, and has no setuid programs it should be able to use.
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  # Resource limits (chapter 17). Node.js sizes its heap from the memory limit.
  deploy:
    resources:
      limits:
        cpus: "1"
        memory: 256M
        pids: 100

services:
  # No published ports: only nginx is reachable from outside.
  api:
    <<: *snip
    environment:
      <<: *snip-env
      BASE_URL: ${BASE_URL:-https://localhost:8443}
    networks: [default, edge]
    deploy:
      replicas: 2               # two containers, so one can be replaced while the other serves
      resources:
        limits:
          cpus: "1"
          memory: 256M
          pids: 100
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy

  nginx:
    image: nginx:1.31-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${CERTS_DIR:-./certs}:/etc/nginx/certs:ro
      - ${ACME_DIR:-./acme}:/var/www/certbot:ro   # Let's Encrypt HTTP-01 challenge files
    networks: [edge]            # can reach the API containers, not the databases
    # The master process starts as root and switches its workers to the nginx user.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /run
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s
    depends_on:
      api:
        condition: service_healthy

  worker:
    <<: *snip
    command: ["src/worker.js"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
          pids: 50
    healthcheck:
      disable: true             # the image's HEALTHCHECK probes the API's port
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy

  migrate:
    <<: *snip
    command: ["src/migrate.js"]
    restart: "no"               # a job: run once, exit
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
        restart: true

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
    # /dev/shm is 64 MB by default; PostgreSQL uses it for parallel queries.
    shm_size: 256m
    # The entrypoint starts as root to fix ownership of the data directory, then switches to the
    # postgres user: that needs these capabilities, and nothing else.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /var/run/postgresql
      - /tmp
    environment:
      POSTGRES_USER: snip
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: snip
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      # -h 127.0.0.1: during first-time initialization PostgreSQL only listens on its Unix
      # socket, so a TCP check stays unhealthy until the real server is up.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "snip", "-d", "snip"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s

  valkey:
    image: valkey/valkey:9-alpine
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    # The entrypoint fixes ownership of /data as root (CHOWN, and DAC_OVERRIDE to look inside the
    # valkey-owned appendonlydir on restarts), then switches to the valkey user (SETGID, SETUID).
    # tini, running as root, forwards docker stop's SIGTERM to the valkey user's process (KILL).
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, KILL, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    read_only: true
    # Valkey's own limit is well below the container's: rewriting the append-only file forks
    # a child process whose memory counts against the same limit. volatile-lru evicts only
    # keys with an expiry (the url:* cache), never the clicks queue.
    command: ["valkey-server", "--appendonly", "yes",
              "--maxmemory", "96mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
      start_interval: 1s

  # docker compose run --rm psql
  psql:
    image: postgres:18-alpine
    profiles: [tools]
    # psql can't read a password file directly, so a tiny shell wrapper reads the secret.
    entrypoint: ["sh", "-c", "PGPASSWORD=$$(cat /run/secrets/db_password) exec psql \"$$@\"", "psql"]
    environment:
      PGHOST: db
      PGUSER: snip
      PGDATABASE: snip
    secrets:
      - db_password
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  valkeydata:

networks:
  default:                      # api, worker, migrate, db, valkey
  edge:                         # nginx and api

secrets:
  db_password:
    file: ./secrets/db_password.txt   # created by ./create-secrets.sh; never committed
