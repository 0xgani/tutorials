# Snip's pipeline (chapter 22). Copy .github/ to the root of the repository that holds this project.
#   Pull requests:   unit tests, the full stack with integration tests, a vulnerability scan.
#   Pushes to main:  the same, then a multi-platform image with SBOM and provenance, pushed and signed.
#   Version tags:    all of that, then a zero-downtime deploy to the production server by digest.
# Repository settings it expects: an environment "production" with the secrets DEPLOY_SSH_KEY and
# DEPLOY_KNOWN_HOSTS, and the variable DEPLOY_HOST.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Unit tests (the Dockerfile's test stage)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          outputs: type=cacheonly
          cache-from: type=gha,scope=snip
          cache-to: type=gha,scope=snip,mode=max

      - name: Start the stack (production image and settings, self-signed certificate)
        run: |
          ./create-secrets.sh
          ./create-dev-cert.sh
          cp .env.example .env
          docker compose -f compose.yaml up -d --build --wait

      - name: Integration tests, from inside the stack's network
        run: |
          docker run --rm --network snip_default -v "$PWD/test:/test:ro" \
            -e SNIP_URL=http://api:3000 node:24-alpine node --test /test/integration.test.js

      - name: Smoke test through nginx
        run: |
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost:8443/healthz)" = 200
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost:8443/metrics)" = 404

      - name: Scan the image (fail on fixable critical vulnerabilities)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.75.0 \
            image --exit-code 1 --severity CRITICAL --ignore-unfixed snip:2.0

      - name: Show logs
        if: failure()
        run: docker compose -f compose.yaml logs

  publish:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write                      # keyless signing with the workflow's identity
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/setup-qemu-action@v4  # only for RUN steps of the arm64 image; Snip's runtime stage has none

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/snip
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=snip
          cache-to: type=gha,scope=snip,mode=max

      - uses: sigstore/cosign-installer@v4

      - name: Sign the image (by digest, never by tag)
        env:
          OWNER: ${{ github.repository_owner }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/${OWNER,,}/snip@${DIGEST}"

  deploy:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    concurrency: production                # never two deploys at once
    steps:
      - name: Deploy the signed digest over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ vars.DEPLOY_HOST }}
          OWNER: ${{ github.repository_owner }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          image="ghcr.io/${OWNER,,}/snip@${DIGEST}"
          # $image is expanded here, on the runner, on purpose: the server gets the final ref
          # shellcheck disable=SC2029
          ssh "deploy@$HOST" "cd /srv/snip && git pull --ff-only && ./deploy.sh $image"
